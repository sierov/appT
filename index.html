<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Облік</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F2; --surface:#FFFFFF; --surface-2:#EEF0EE; --ink:#14161B; --ink-soft:#5B6169;
    --line:#E1E3E0; --accent:#2F5FDE; --accent-ink:#FFFFFF; --income:#1E9E6B; --expense:#D6455A;
    --radius:14px; --accent-soft:#E8EDFC;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#131417; --surface:#1C1E23; --surface-2:#24262C; --ink:#EDEEF0; --ink-soft:#9AA0AA;
      --line:#2E3138; --accent:#5B84F2; --accent-ink:#0E1117; --income:#3FC98E; --expense:#F0677D;
      --accent-soft:#1E2740;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131417; --surface:#1C1E23; --surface-2:#24262C; --ink:#EDEEF0; --ink-soft:#9AA0AA;
    --line:#2E3138; --accent:#5B84F2; --accent-ink:#0E1117; --income:#3FC98E; --expense:#F0677D;
    --accent-soft:#1E2740;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif; -webkit-tap-highlight-color:transparent;
  }
  #app{display:flex; flex-direction:column; min-height:100vh;}
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;
    display:flex; align-items:center; gap:10px; border-bottom:1px solid transparent;
  }
  header.topbar.scrolled{border-bottom-color:var(--line);}
  .back-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;
  }
  h1.page-title{font-size:20px; font-weight:800; margin:0; letter-spacing:-0.01em;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-soft); opacity:.4; margin-left:auto; flex:none; transition:.2s;}
  .sync-dot.busy{background:var(--accent); opacity:1;}
  main{flex:1; padding:6px 18px calc(96px + env(safe-area-inset-bottom,0px)); max-width:640px; width:100%; margin:0 auto;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  .stat-card{padding:18px 16px;}
  .stat-label{font-size:13px; color:var(--ink-soft); font-weight:600; margin:0 0 6px;}
  .stat-value{font-size:26px; font-weight:800; letter-spacing:-0.02em; margin:0;}
  .stat-value.pos{color:var(--income);}
  .stat-value.neg{color:var(--expense);}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .section-heading{font-size:13px; font-weight:700; text-transform:none; color:var(--ink-soft); margin:22px 2px 10px;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .modal-back{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:18px;}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; width:100%; max-width:340px; box-shadow:0 14px 40px rgba(0,0,0,.3);}
  .modal-text{font-size:15px; font-weight:600; line-height:1.45; margin-bottom:16px; color:var(--ink);}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions .btn{flex:1; padding:12px 8px;}
  .btn.danger-fill{background:var(--expense); color:#fff;}
  .row.tap{cursor:pointer; border-radius:10px; gap:10px;}
  .row.tap:active{background:var(--surface-2);}
  .row-end{display:flex; align-items:center; gap:8px; flex:none;}
  .row-end .chev{color:var(--ink-soft); font-size:18px; line-height:1;}
  .list-card{padding:4px 12px;}
  .list-title{font-weight:700; font-size:15px;}
  .list-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .amount{font-weight:800; font-size:15px; white-space:nowrap;}
  .amount.income{color:var(--income);}
  .amount.expense{color:var(--expense);}
  .empty{text-align:center; padding:48px 16px; color:var(--ink-soft);}
  .empty .big{font-size:34px; margin-bottom:8px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
    padding:13px 18px; font-weight:700; font-size:15px; font-family:inherit; width:100%; cursor:pointer;
  }
  .btn.secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
  .btn.danger{background:transparent; color:var(--expense); border:1px solid var(--line);}
  .fab{
    position:fixed; right:18px; bottom:calc(88px + env(safe-area-inset-bottom,0px)); z-index:25;
    width:54px; height:54px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    border:none; font-size:26px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=tel], input[type=number], input[type=date], textarea, select{
    width:100%; padding:12px 13px; border-radius:11px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); font-size:15px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .avatar{
    width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex:none;
  }
  .avatar-lg{width:60px; height:60px; font-size:21px; margin:0 auto;}
  .client-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .client-row:last-child{border-bottom:none;}
  nav.bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  nav.bottomnav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 2px; color:var(--ink-soft); font-family:inherit; cursor:pointer;
  }
  nav.bottomnav button .ic{font-size:20px; line-height:1;}
  nav.bottomnav button .lb{font-size:10.5px; font-weight:700;}
  nav.bottomnav button.active{color:var(--accent);}
  .seg{display:flex; background:var(--surface-2); border-radius:11px; padding:3px; margin-bottom:14px; border:1px solid var(--line);}
  .seg button{flex:1; border:none; background:none; padding:9px 4px; border-radius:9px; font-family:inherit; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer;}
  .seg button.active{background:var(--accent); color:var(--accent-ink);}
  .combo{position:relative;}
  .picker{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:15; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 28px rgba(0,0,0,.16);
    max-height:236px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:4px;
  }
  .picker[hidden]{display:none;}
  .picker-item{display:flex; align-items:center; gap:10px; padding:8px; border-radius:9px; cursor:pointer;}
  .picker-item:hover, .picker-item:active{background:var(--surface-2);}
  .picker-item .avatar{width:34px; height:34px; font-size:13px;}
  .picker-item .txt{min-width:0; flex:1;}
  .picker-item .list-title, .picker-item .list-sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .picker-empty{padding:12px; font-size:13px; color:var(--ink-soft);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 4px;}
  .switch{position:relative; width:46px; height:27px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; transition:.15s; cursor:pointer;}
  .slider:before{content:""; position:absolute; height:19px; width:19px; left:3px; top:3px; background:white; border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--accent); border-color:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(19px);}
  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:11px; font-size:14px; font-weight:600;
    z-index:60; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .divider-total{display:flex; justify-content:space-between; align-items:center; padding-top:14px; margin-top:4px; border-top:1px dashed var(--line);}
  .divider-total .v{font-size:19px; font-weight:800;}
  .about-p{font-size:14px; line-height:1.6; color:var(--ink-soft); margin:0 0 10px;}
  a.tel-link{color:var(--accent); text-decoration:none; font-weight:700;}
  .discount-box{background:var(--accent-soft); border:1px solid var(--line); border-radius:11px; padding:12px 14px; margin-top:14px;}
  .discount-box .toggle-row{padding:0;}
  .discount-box label.switch{margin:0;}
  .note-block{background:var(--surface-2); border-radius:11px; padding:12px 14px; font-size:14px; color:var(--ink-soft); line-height:1.5;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Telegram Mini App integration ---------- */
let TG = null;
try{
  if(window.Telegram && window.Telegram.WebApp){
    TG = window.Telegram.WebApp;
    TG.ready(); TG.expand();
    const tp = TG.themeParams || {};
    const map = {
      bg_color:'--bg', secondary_bg_color:'--surface-2', section_bg_color:'--surface',
      text_color:'--ink', hint_color:'--ink-soft', button_color:'--accent',
      button_text_color:'--accent-ink', section_separator_color:'--line'
    };
    Object.keys(map).forEach(k=>{ if(tp[k]) document.documentElement.style.setProperty(map[k], tp[k]); });
    if(TG.setHeaderColor) try{ TG.setHeaderColor(tp.bg_color ? tp.bg_color : 'bg_color'); }catch(e){}
    if(TG.setBackgroundColor && tp.bg_color) try{ TG.setBackgroundColor(tp.bg_color); }catch(e){}
    document.documentElement.setAttribute('data-theme', TG.colorScheme || '');
  }
}catch(e){}
function haptic(kind){ try{ if(TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred(kind||'light'); }catch(e){} }
const hasCloud = !!(TG && TG.CloudStorage);

/* ---------- Cloud/local storage (auto-save, chunked for CloudStorage's 4096-char limit) ---------- */
function csCall(method, ...args){
  return new Promise((resolve, reject)=>{
    TG.CloudStorage[method](...args, (err, res)=> err ? reject(err) : resolve(res));
  });
}
async function cloudSave(name, obj){
  const str = JSON.stringify(obj);
  if(!hasCloud){ localStorage.setItem('local_'+name, str); return; }
  const CHUNK = 3500;
  const chunks = []; for(let i=0;i<str.length;i+=CHUNK) chunks.push(str.slice(i,i+CHUNK));
  const prevMetaRaw = await csCall('getItem', name+'_meta').catch(()=>null);
  const prevCount = prevMetaRaw ? parseInt(prevMetaRaw)||0 : 0;
  for(let i=0;i<chunks.length;i++) await csCall('setItem', name+'_'+i, chunks[i]);
  for(let i=chunks.length;i<prevCount;i++) await csCall('removeItem', name+'_'+i).catch(()=>{});
  await csCall('setItem', name+'_meta', String(chunks.length));
}
async function cloudLoad(name, fallback){
  if(!hasCloud){ try{ const v = localStorage.getItem('local_'+name); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
  try{
    const meta = await csCall('getItem', name+'_meta');
    const count = meta ? parseInt(meta)||0 : 0;
    if(!count) return fallback;
    let str = '';
    for(let i=0;i<count;i++){ str += (await csCall('getItem', name+'_'+i)) || ''; }
    return str ? JSON.parse(str) : fallback;
  }catch(e){ return fallback; }
}
function setSyncBusy(on){ const d = document.getElementById('syncDot'); if(d) d.classList.toggle('busy', on); }

let state = { clients:[], records:[], expenses:[], settings:{} };
let saveQueue = Promise.resolve();
function persist(part){
  const map = {clients:'clients', records:'records', expenses:'expenses', settings:'settings'};
  const key = map[part];
  setSyncBusy(true);
  saveQueue = saveQueue.then(()=>cloudSave(key, state[key])).then(()=>setSyncBusy(false)).catch(()=>{ setSyncBusy(false); toast('Не вдалося синхронізувати дані'); });
}
async function bootData(){
  const [clients, records, expenses, settings] = await Promise.all([
    cloudLoad('clients', []), cloudLoad('records', []), cloudLoad('expenses', []), cloudLoad('settings', {})
  ]);
  state = {clients, records, expenses, settings};
  if(state.records.some(r=>!r.id)){ state.records.forEach(r=>{ if(!r.id) r.id = uid(); }); persist('records'); }
  if(state.expenses.some(e=>!e.id)){ state.expenses.forEach(e=>{ if(!e.id) e.id = uid(); }); persist('expenses'); }
  applyTheme(); render();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* сортування: найновіші дати вгорі; при однаковій даті — той, що доданий пізніше, вище */
function byDateDesc(a,b){ const x=a.date||'', y=b.date||''; return x<y ? 1 : x>y ? -1 : 0; }
function newestFirst(list){ return [...list].reverse().sort(byDateDesc); }

/* ---------- theme ---------- */
function applyTheme(){
  if(!TG){ document.documentElement.removeAttribute('data-theme'); }
  document.documentElement.style.setProperty('--accent', '#2F5FDE');
}

/* ---------- nav / view stack ---------- */
let nav = { tab:'home', view:'home', params:{} };
function go(view, params){ nav.view = view; nav.params = params||{}; render(); window.scrollTo(0,0); }
function setTab(tab){ haptic('light'); nav.tab = tab; go(tab, {}); }

/* ---------- helpers ---------- */
function money(n){ n = Number(n)||0; return n.toLocaleString('uk-UA', {maximumFractionDigits:0}) + ' ₴'; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('uk-UA', {day:'numeric', month:'long', year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('uk-UA', {day:'numeric', month:'short'}); }
function monthKey(iso){ return (iso||'').slice(0,7); }
function initials(name){ if(!name) return '?'; const parts = name.trim().split(/\s+/); return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?'; }
let toastTimer;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2200); }
/* власне вікно підтвердження: window.confirm() у Telegram часто блокується */
function askConfirm(text, okLabel, onYes){
  const old = document.getElementById('confirmModal'); if(old) old.remove();
  const el = document.createElement('div'); el.id = 'confirmModal'; el.className = 'modal-back';
  el.innerHTML = `<div class="modal"><div class="modal-text">${esc(text)}</div>
    <div class="modal-actions"><button class="btn secondary" data-a="no">Скасувати</button><button class="btn danger-fill" data-a="yes">${esc(okLabel)}</button></div></div>`;
  el.addEventListener('click', e=>{
    const a = e.target.closest('[data-a]');
    if(a){ el.remove(); if(a.dataset.a==='yes') onYes(); }
    else if(e.target===el) el.remove();
  });
  document.body.appendChild(el);
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- автознижки ---------- */
const VISIT_EVERY = 10;   // кожне 10-те відвідування
const BDAY_WINDOW = 3;    // день народження ± 3 дні
function discountSettings(){
  const s = state.settings || {};
  const clamp = v => Math.min(100, Math.max(0, Number(v)||0));
  return { visit: clamp(s.discountVisit), birthday: clamp(s.discountBirthday) };
}
function phoneKey(p){ const d = (p||'').replace(/\D/g,''); return d.length>=9 ? d.slice(-9) : d; }
function nameKey(n){ return (n||'').trim().toLowerCase(); }
function recordsOfClient(c){
  const pk = phoneKey(c.phone), nk = nameKey(c.fio);
  return state.records.filter(r=>{
    if(r.clientId) return r.clientId===c.id;
    const rp = phoneKey(r.phone);
    if(pk && rp) return pk===rp;
    return !rp && nk && nameKey(r.fio)===nk;
  });
}
function findClientFor(fio, phone, prefillId){
  const pk = phoneKey(phone), nk = nameKey(fio);
  if(prefillId){
    const p = state.clients.find(c=>c.id===prefillId);
    if(p && ((pk && phoneKey(p.phone)===pk) || (nk && nameKey(p.fio)===nk))) return p;
  }
  if(pk){ const m = state.clients.find(c=>phoneKey(c.phone)===pk); if(m) return m; }
  if(nk){ const m = state.clients.find(c=>nameKey(c.fio)===nk); if(m) return m; }
  return null;
}
function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }
// різниця в днях між датою запису та найближчим днем народження (може бути від’ємною)
function birthdayDiff(dob, dateISO){
  if(!dob || !dateISO) return null;
  const [, bm, bd] = dob.split('-').map(Number);
  const [y, m, d] = dateISO.split('-').map(Number);
  if(!bm || !bd || !y || !m || !d) return null;
  const target = Date.UTC(y, m-1, d);
  let best = null;
  for(let yy=y-1; yy<=y+1; yy++){
    const day = (bm===2 && bd===29 && !isLeap(yy)) ? 28 : bd;
    const diff = Math.round((target - Date.UTC(yy, bm-1, day)) / 86400000);
    if(best===null || Math.abs(diff)<Math.abs(best)) best = diff;
  }
  return best;
}
function birthdayActive(client, dateISO){
  const diff = birthdayDiff(client && client.dob, dateISO);
  return diff!==null && Math.abs(diff)<=BDAY_WINDOW;
}
// повертає {pct, reason, label}; якщо діють обидві знижки — береться більша
function calcDiscount(client, dateISO){
  const none = {pct:0, reason:null, label:''};
  if(!client) return none;
  const cfg = discountSettings();
  const options = [];
  if(cfg.visit>0){
    const visitNo = recordsOfClient(client).length + 1;
    if(visitNo % VISIT_EVERY === 0) options.push({pct:cfg.visit, reason:'visit', label:visitNo+'-й візит'});
  }
  if(cfg.birthday>0 && birthdayActive(client, dateISO)){
    options.push({pct:cfg.birthday, reason:'birthday', label:'День народження'});
  }
  if(!options.length) return none;
  options.sort((a,b)=>b.pct-a.pct);
  return options[0];
}
function applyPct(price, pct){ return Math.round(price * (100 - pct) / 100); }
function discTag(r){ return r.discountPct ? ' · знижка −'+r.discountPct+'%' : ''; }

/* ================= RENDER ROOT ================= */
function render(){
  const app = document.getElementById('app');
  const titles = {
    home:'Головний екран', clients:'Клієнти', clientAdd:'Новий клієнт', clientProfile:'Профіль',
    records:'Записи', recordAdd:'Новий запис', recordEdit:'Редагування запису', expenses:'Витрати', expenseAdd:'Нова витрата', expenseEdit:'Редагування витрати',
    stats:'Статистика', settings:'Налаштування'
  };
  const showBack = !['home','clients','records','expenses','stats','settings'].includes(nav.view);

  app.innerHTML = `
    <header class="topbar" id="topbar">
      ${showBack ? `<button class="back-btn" onclick="goBack()">‹</button>` : ''}
      <h1 class="page-title">${titles[nav.view] || ''}</h1>
      <div class="sync-dot" id="syncDot" title="Синхронізація"></div>
    </header>
    <main id="main"></main>
    ${renderFab()}
    <nav class="bottomnav">
      ${navBtn('home','⌂','Головна')}
      ${navBtn('clients','☺','Клієнти')}
      ${navBtn('records','▤','Записи')}
      ${navBtn('expenses','◈','Витрати')}
      ${navBtn('stats','▲','Статистика')}
      ${navBtn('settings','⚙','Налашт.')}
    </nav>
  `;
  const views = {
    home: renderHome, clients: renderClients, clientAdd: renderClientAdd, clientProfile: renderClientProfile,
    records: renderRecords, recordAdd: renderRecordAdd, recordEdit: renderRecordEdit, expenses: renderExpenses, expenseAdd: renderExpenseAdd, expenseEdit: renderExpenseEdit,
    stats: renderStats, settings: renderSettings
  };
  document.getElementById('main').innerHTML = (views[nav.view]||renderHome)();
  if(nav.view==='recordAdd' || nav.view==='recordEdit') updateRecordDiscount();
  const topbar = document.getElementById('topbar');
  window.onscroll = ()=>{ topbar.classList.toggle('scrolled', window.scrollY > 4); };

  if(TG){
    try{
      if(showBack){ TG.BackButton.show(); TG.BackButton.onClick(goBack); }
      else { TG.BackButton.hide(); }
    }catch(e){}
  }
}
function goBack(){
  if(nav.view==='recordEdit'){ leaveRecordEdit(); return; }
  if(nav.view==='expenseEdit'){ leaveExpenseEdit(); return; }
  if(nav.view==='clientProfile' && nav.params.edit){ go('clientProfile',{id:nav.params.id}); return; }
  const target = nav.tab==='clientProfile' ? 'home' : nav.tab;
  go(target, {});
}
function navBtn(id, icon, label){
  const active = nav.tab===id ? 'active' : '';
  return `<button class="${active}" onclick="setTab('${id}')"><span class="ic">${icon}</span><span class="lb">${label}</span></button>`;
}
function renderFab(){
  if(nav.view==='clients') return `<button class="fab" onclick="go('clientAdd')">+</button>`;
  if(nav.view==='records') return `<button class="fab" onclick="go('recordAdd')">+</button>`;
  if(nav.view==='expenses') return `<button class="fab" onclick="go('expenseAdd')">+</button>`;
  if(nav.view==='clientProfile' && !nav.params.edit) return `<button class="fab" onclick="go('recordAdd', {clientId:'${nav.params.id}'})">+</button>`;
  return '';
}

/* ================= ГОЛОВНИЙ ЕКРАН ================= */
function renderHome(){
  const mk = monthKey(todayISO());
  const gross = state.records.filter(r=>monthKey(r.date)===mk).reduce((s,r)=>s+Number(r.price||0),0);
  const exp = state.expenses.filter(e=>monthKey(e.date)===mk).reduce((s,e)=>s+Number(e.total||0),0);
  const net = gross - exp;
  const events = [
    ...[...state.records].reverse().map(r=>({type:'income', date:r.date, title:r.fio||'Запис', sub:'Запис'+discTag(r), amount:Number(r.price||0)})),
    ...[...state.expenses].reverse().map(e=>({type:'expense', date:e.date, title:e.shop||'Витрата', sub:'Витрата · '+ (e.qty||1)+' шт.', amount:Number(e.total||0)}))
  ].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  return `
    <div class="stat-grid">
      <div class="card stat-card"><p class="stat-label">Валовий прибуток за місяць</p><p class="stat-value">${money(gross)}</p></div>
      <div class="card stat-card"><p class="stat-label">Чистий прибуток за місяць</p><p class="stat-value ${net>=0?'pos':'neg'}">${money(net)}</p></div>
    </div>
    <div class="card stat-card"><p class="stat-label">Витрати за місяць</p><p class="stat-value neg">${money(exp)}</p></div>

    <p class="section-heading">Історія доходів і витрат</p>
    ${events.length ? `<div class="card list-card">${events.map(ev=>`
      <div class="row">
        <div><div class="list-title">${esc(ev.title)}</div><div class="list-sub">${ev.sub} · ${fmtDateShort(ev.date)}</div></div>
        <div class="amount ${ev.type==='income'?'income':'expense'}">${ev.type==='income'?'+':'−'}${money(ev.amount)}</div>
      </div>`).join('')}</div>`
    : emptyState('◌','Поки що немає записів', 'Додайте запис або витрату — історія з’явиться тут')}
  `;
}

function renderRecords(){
  const oldFirst = state.settings.recordsSort === 'old';

  if(oldFirst) list.reverse();

  return `<div class="seg">
      <button class="${!oldFirst?'active':''}" onclick="setRecordsSort('new')">Спочатку нові</button>

    </div>
    <div class="card list-card">${list.map(r=>`
    <div class="row tap" onclick="go('recordEdit',{id:'${r.id}'})">
      <div><div class="list-title">${esc(r.fio)||'Без імені'}</div><div class="list-sub">${esc(r.phone)||'—'} · ${fmtDate(r.date)}${discTag(r)}</div></div>
      <div class="row-end"><div class="amount income">${money(r.price)}</div><span class="chev">›</span></div>
    </div>`).join('')}</div>`;
}
function setRecordsSort(mode){ state.settings.recordsSort = mode; persist('settings'); haptic('light'); render(); }
let recordDiscountOff = false;
let recordSelectedClient = null;
function recordFormDiscount(){
  const fio = document.getElementById('r_fio').value;
  const phone = document.getElementById('r_phone').value;
  const date = document.getElementById('r_date').value || todayISO();
  const client = findClientFor(fio, phone, recordSelectedClient || nav.params.clientId);
  return { client, date, d: calcDiscount(client, date) };
}
function updateRecordDiscount(){
  const box = document.getElementById('r_discount'); if(!box) return;
  if(nav.view==='recordEdit'){ updateEditDiscount(box); return; }
  const { client, d } = recordFormDiscount();
  if(!d.pct){ box.innerHTML = ''; return; }
  const base = Number(document.getElementById('r_price').value) || 0;
  const on = !recordDiscountOff;
  box.innerHTML = `
    <div class="discount-box">
      <div class="toggle-row">
        <div><div class="list-title">Знижка −${d.pct}%</div><div class="list-sub">${d.label} · ${esc(client.fio)}</div></div>
        <label class="switch"><input type="checkbox" ${on?'checked':''} onchange="toggleRecordDiscount(this.checked)"><span class="slider"></span></label>
      </div>
      <div class="divider-total"><span>До сплати</span><span class="v">${money(on ? applyPct(base, d.pct) : base)}</span></div>
    </div>`;
}
function toggleRecordDiscount(on){ recordDiscountOff = !on; updateRecordDiscount(); }
/* --- вибір клієнта зі списку (випадаючий список + пошук) --- */
function pickerMatches(q){
  const t = (q||'').trim().toLowerCase();
  const digits = t.replace(/\D/g,'');
  return [...state.clients]
    .sort((a,b)=>(a.fio||'').localeCompare(b.fio||'','uk'))
    .filter(c=>{
      if(!t) return true;
      if((c.fio||'').toLowerCase().includes(t)) return true;
      return digits.length>=2 && (c.phone||'').replace(/\D/g,'').includes(digits);
    });
}
function renderClientPicker(){
  const box = document.getElementById('r_picker'); if(!box) return;
  const fioEl = document.getElementById('r_fio');
  if(!state.clients.length){ box.hidden = true; return; }
  const list = pickerMatches(fioEl.value);
  box.innerHTML = list.length
    ? list.map(c=>`
        <div class="picker-item" onclick="pickClient('${c.id}')">
          <div class="avatar">${initials(c.fio)}</div>
          <div class="txt"><div class="list-title">${esc(c.fio)||'Без імені'}</div><div class="list-sub">${esc(c.phone)||'—'}</div></div>
        </div>`).join('')
    : `<div class="picker-empty">Немає збігів — запис буде додано без прив’язки до клієнта</div>`;
  box.hidden = false;
}
function closeClientPicker(){ const box = document.getElementById('r_picker'); if(box) box.hidden = true; }
function onFioInput(){ recordSelectedClient = null; renderClientPicker(); updateRecordDiscount(); }
function pickClient(id){
  const c = state.clients.find(x=>x.id===id); if(!c) return;
  recordSelectedClient = c.id;
  document.getElementById('r_fio').value = c.fio || '';
  document.getElementById('r_phone').value = c.phone || '';
  closeClientPicker(); document.getElementById('r_fio').blur();
  haptic('light'); updateRecordDiscount();
}
// якщо ПІБ введено повністю вручну і збігається з клієнтом — номер підтягується сам
function fioBlur(){
  setTimeout(()=>{
    closeClientPicker();
    const fioEl = document.getElementById('r_fio'), phoneEl = document.getElementById('r_phone');
    if(!fioEl || !phoneEl || phoneEl.value.trim()) return;
    const nk = nameKey(fioEl.value); if(!nk) return;
    const m = state.clients.filter(c=>nameKey(c.fio)===nk && c.phone);
    if(m.length===1){ recordSelectedClient = m[0].id; phoneEl.value = m[0].phone; updateRecordDiscount(); }
  }, 120);
}
function renderRecordAdd(){
  recordDiscountOff = false;
  recordSelectedClient = nav.params.clientId || null;
  const prefillClient = nav.params.clientId ? state.clients.find(c=>c.id===nav.params.clientId) : null;
  return `
    <div class="card">
      <label>ПІБ</label>
      <div class="combo">
        <input type="text" id="r_fio" autocomplete="off" value="${prefillClient?esc(prefillClient.fio):''}" placeholder="Оберіть клієнта або введіть ПІБ"
               onfocus="renderClientPicker()" oninput="onFioInput()" onblur="fioBlur()">
        <div class="picker" id="r_picker" hidden onmousedown="event.preventDefault()"></div>
      </div>
      <label>Номер телефону</label>
      <input type="tel" id="r_phone" value="${prefillClient?esc(prefillClient.phone):''}" placeholder="+380 00 000 00 00" oninput="updateRecordDiscount()">
      <label>Дата запису</label>
      <input type="date" id="r_date" value="${todayISO()}" oninput="updateRecordDiscount()">
      <label>Ціна</label>
      <input type="number" id="r_price" inputmode="decimal" placeholder="0" oninput="updateRecordDiscount()">
      <div id="r_discount"></div>
    </div>
    <button class="btn" onclick="saveRecord('${prefillClient?prefillClient.id:''}')">Зберегти запис</button>
  `;
}
function saveRecord(clientId){
  const fio = document.getElementById('r_fio').value.trim();
  const price = Number(document.getElementById('r_price').value)||0;
  if(!fio){ toast('Вкажіть ПІБ'); return; }
  const { client, date, d } = recordFormDiscount();
  const useDisc = d.pct>0 && !recordDiscountOff;
  const rec = { id:uid(), fio, phone:document.getElementById('r_phone').value.trim(), date, price: useDisc ? applyPct(price, d.pct) : price, clientId: client ? client.id : null };
  if(useDisc){ rec.basePrice = price; rec.discountPct = d.pct; rec.discountReason = d.reason; }
  state.records.push(rec);
  persist('records'); haptic('medium'); toast(useDisc ? 'Запис додано · знижка −'+d.pct+'%' : 'Запис додано');
  if(clientId && !(client && client.id!==clientId)) go('clientProfile',{id:clientId}); else { nav.tab='records'; go('records'); }
}

/* --- редагування та видалення запису --- */
function renderRecordEdit(){
  const r = state.records.find(x=>x.id===nav.params.id);
  if(!r) return emptyState('▤','Запис не знайдено','Можливо, його вже видалено');

  recordSelectedClient = r.clientId || null;
  const base = (r.discountPct && r.basePrice!=null) ? r.basePrice : r.price;

    <div class="card">
      <label>ПІБ</label>
      <div class="combo">
        <input type="text" id="r_fio" autocomplete="off" value="${esc(r.fio)}" placeholder="Оберіть клієнта або введіть ПІБ"

        <div class="picker" id="r_picker" hidden onmousedown="event.preventDefault()"></div>
      </div>
      <label>Номер телефону</label>
      <input type="tel" id="r_phone" value="${esc(r.phone)}" placeholder="+380 00 000 00 00">
      <label>Дата запису</label>
      <input type="date" id="r_date" value="${r.date||todayISO()}">
      <label>Ціна</label>
      <input type="number" id="r_price" inputmode="decimal" value="${base||''}" placeholder="0" oninput="updateRecordDiscount()">
      <div id="r_discount"></div>

    <button class="btn danger" style="margin-top:10px" onclick="deleteRecord('${r.id}')">Видалити запис</button>
  `;
}
// знижка, що вже була в записі, зберігається; її можна вимкнути перемикачем
function updateEditDiscount(box){
  const r = state.records.find(x=>x.id===nav.params.id);
  if(!r || !r.discountPct){ box.innerHTML = ''; return; }
  const base = Number(document.getElementById('r_price').value) || 0;
  const on = !recordDiscountOff;
  const why = r.discountReason==='birthday' ? 'День народження' : r.discountReason==='visit' ? 'Знижка за візит' : 'Знижка';
  box.innerHTML = `
    <div class="discount-box">
      <div class="toggle-row">
        <div><div class="list-title">Знижка −${r.discountPct}%</div><div class="list-sub">${why}</div></div>
        <label class="switch"><input type="checkbox" ${on?'checked':''} onchange="toggleRecordDiscount(this.checked)"><span class="slider"></span></label>
      </div>
      <div class="divider-total"><span>До сплати</span><span class="v">${money(on ? applyPct(base, r.discountPct) : base)}</span></div>
    </div>`;
}
function leaveRecordEdit(){
  const cid = nav.params.fromClient;
  if(cid && state.clients.some(c=>c.id===cid)) go('clientProfile',{id:cid});
  else { nav.tab = 'records'; go('records'); }
}
function saveRecordEdit(id){
  const r = state.records.find(x=>x.id===id); if(!r){ leaveRecordEdit(); return; }
  const fio = document.getElementById('r_fio').value.trim();
  if(!fio){ toast('Вкажіть ПІБ'); return; }
  const phone = document.getElementById('r_phone').value.trim();
  const price = Number(document.getElementById('r_price').value)||0;
  const date = document.getElementById('r_date').value || r.date || todayISO();
  const client = findClientFor(fio, phone, recordSelectedClient);
  r.fio = fio; r.phone = phone; r.date = date; r.clientId = client ? client.id : null;
  if(r.discountPct && !recordDiscountOff){
    r.basePrice = price; r.price = applyPct(price, r.discountPct);
  } else {
    r.price = price; delete r.basePrice; delete r.discountPct; delete r.discountReason;
  }
  persist('records'); haptic('medium'); toast('Запис оновлено'); leaveRecordEdit();
}
function deleteRecord(id){
  askConfirm('Видалити запис? Цю дію не можна скасувати.', 'Видалити', ()=>{
    state.records = state.records.filter(x=>x.id!==id); persist('records');
    haptic('medium'); toast('Запис видалено'); leaveRecordEdit();
  });
}

/* --- редагування та видалення витрати --- */
function renderExpenseEdit(){
  const e = state.expenses.find(x=>x.id===nav.params.id);
  if(!e) return emptyState('◈','Витрату не знайдено','Можливо, її вже видалено');
  const qty = e.qty || 1;
  const rawPrice = e.price!=null ? Number(e.price) : (Number(e.total)||0) / qty;
  const price = Math.round(rawPrice*100)/100;
  return `
    <div class="card">
      <label>Магазин</label>
      <input type="text" id="x_shop" value="${esc(e.shop)}" placeholder="Назва магазину">
      <label>Ціна за одиницю</label>
      <input type="number" id="x_price" inputmode="decimal" value="${price||''}" placeholder="0" oninput="updateExpenseTotal()">
      <label>Кількість</label>
      <input type="number" id="x_qty" inputmode="decimal" value="${qty}" oninput="updateExpenseTotal()">
      <label>Дата</label>
      <input type="date" id="x_date" value="${e.date||todayISO()}">
      <div class="divider-total"><span>Підсумкова сума</span><span class="v" id="x_total">${money(e.total)}</span></div>
    </div>
    <button class="btn" onclick="saveExpenseEdit('${e.id}')">Зберегти зміни</button>
    <button class="btn danger" style="margin-top:10px" onclick="deleteExpense('${e.id}')">Видалити витрату</button>
  `;
}
function leaveExpenseEdit(){ nav.tab = 'expenses'; go('expenses'); }
function saveExpenseEdit(id){
  const e = state.expenses.find(x=>x.id===id); if(!e){ leaveExpenseEdit(); return; }
  const shop = document.getElementById('x_shop').value.trim();
  if(!shop){ toast('Вкажіть магазин'); return; }
  const price = Number(document.getElementById('x_price').value)||0;
  const qty = Number(document.getElementById('x_qty').value)||1;
  e.shop = shop; e.price = price; e.qty = qty; e.total = price*qty;
  e.date = document.getElementById('x_date').value || e.date || todayISO();
  persist('expenses'); haptic('medium'); toast('Витрату оновлено'); leaveExpenseEdit();
}
function deleteExpense(id){
  askConfirm('Видалити витрату? Цю дію не можна скасувати.', 'Видалити', ()=>{
    state.expenses = state.expenses.filter(x=>x.id!==id); persist('expenses');
    haptic('medium'); toast('Витрату видалено'); leaveExpenseEdit();
  });
}

/* ================= СТАТИСТИКА ================= */
let statsPeriod = 'month';
function renderStats(){
  const today = new Date();
  let from, to;
  if(statsPeriod==='month'){ from = new Date(today.getFullYear(), today.getMonth(), 1); to = new Date(today.getFullYear(), today.getMonth()+1, 0); }
  else if(statsPeriod==='year'){ from = new Date(today.getFullYear(), 0, 1); to = new Date(today.getFullYear(), 11, 31); }
  else { from = window.__statsFrom ? new Date(window.__statsFrom) : new Date(today.getFullYear(), today.getMonth(), 1); to = window.__statsTo ? new Date(window.__statsTo) : today; }
  const fromISO = from.toISOString().slice(0,10), toISO = to.toISOString().slice(0,10);
  const recs = state.records.filter(r=> r.date>=fromISO && r.date<=toISO);
  const exps = state.expenses.filter(e=> e.date>=fromISO && e.date<=toISO);
  const gross = recs.reduce((s,r)=>s+Number(r.price||0),0);
  const exp = exps.reduce((s,e)=>s+Number(e.total||0),0);
  const events = [
    ...[...recs].reverse().map(r=>({type:'income', date:r.date, title:r.fio||'Запис', amount:Number(r.price||0)})),
    ...[...exps].reverse().map(e=>({type:'expense', date:e.date, title:e.shop||'Витрата', amount:Number(e.total||0)}))
  ].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  return `
    <div class="seg">
      <button class="${statsPeriod==='month'?'active':''}" onclick="statsPeriod='month'; render()">Місяць</button>
      <button class="${statsPeriod==='year'?'active':''}" onclick="statsPeriod='year'; render()">Рік</button>
      <button class="${statsPeriod==='custom'?'active':''}" onclick="statsPeriod='custom'; render()">Період</button>
    </div>
    ${statsPeriod==='custom' ? `
      <div class="card">
        <label>З</label><input type="date" value="${window.__statsFrom||fromISO}" onchange="window.__statsFrom=this.value; render()">
        <label>По</label><input type="date" value="${window.__statsTo||toISO}" onchange="window.__statsTo=this.value; render()">
      </div>` : ''}
    <div class="stat-grid">
      <div class="card stat-card"><p class="stat-label">Дохід</p><p class="stat-value pos">${money(gross)}</p></div>
      <div class="card stat-card"><p class="stat-label">Витрата</p><p class="stat-value neg">${money(exp)}</p></div>
    </div>
    <div class="card stat-card"><p class="stat-label">Чистий прибуток</p><p class="stat-value ${gross-exp>=0?'pos':'neg'}">${money(gross-exp)}</p></div>

    <p class="section-heading">Історія за період</p>
    ${events.length ? `<div class="card list-card">${events.map(ev=>`
      <div class="row">
        <div><div class="list-title">${esc(ev.title)}</div><div class="list-sub">${fmtDate(ev.date)}</div></div>
        <div class="amount ${ev.type==='income'?'income':'expense'}">${ev.type==='income'?'+':'−'}${money(ev.amount)}</div>
      </div>`).join('')}</div>` : `<div class="card"><p class="about-p" style="margin:0;">Немає операцій за цей період</p></div>`}
  `;
}

/* ================= НАЛАШТУВАННЯ ================= */
function renderSettings(){
  const s = state.settings;
  return `
    <p class="section-heading">Автоскидки</p>
    <div class="card">
      <label>Знижка на кожне ${VISIT_EVERY}-те відвідування, %</label>
      <input type="number" inputmode="decimal" min="0" max="100" value="${s.discountVisit||0}" onchange="setDiscount('discountVisit', this)">
      <label>Знижка на день народження (± ${BDAY_WINDOW} дні), %</label>
      <input type="number" inputmode="decimal" min="0" max="100" value="${s.discountBirthday||0}" onchange="setDiscount('discountBirthday', this)">
      <p class="about-p" style="margin:12px 0 0;">0 — знижку вимкнено. Застосовується автоматично під час додавання запису для клієнтів зі списку. Якщо діють обидві знижки одразу, береться більша.</p>
    </div>

    <p class="section-heading">Про програму</p>
    <div class="card">
      <p class="about-p"><strong style="color:var(--ink)">Облік клієнтів і фінансів</strong><br>Версія 1.2</p>
      <p class="about-p">Застосунок для обліку клієнтів, записів і витрат малого бізнесу. Дані автоматично зберігаються ${hasCloud ? 'в хмарі Telegram і доступні на будь-якому вашому пристрої, де відкрито цього бота.' : 'локально в цьому браузері (хмарне збереження Telegram недоступне поза застосунком Telegram).'}</p>
    </div>
  `;
}
function setDiscount(key, el){
  const v = Math.min(100, Math.max(0, Number(el.value)||0));
  el.value = v; state.settings[key] = v; persist('settings'); toast('Збережено');
}

/* ================= допоміжне ================= */
function emptyState(icon, title, sub){
  return `<div class="empty"><div class="big">${icon}</div><div style="font-weight:700; color:var(--ink); margin-bottom:4px;">${title}</div><div>${sub}</div></div>`;
}

window.setTab = setTab; window.go = go; window.goBack = goBack;

/* boot */
bootData();
</script>
</body>
